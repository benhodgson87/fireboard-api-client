name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for library bootstrap
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "Package not present yet; waiting for the library PR to merge."
      - name: Generate bot token
        if: ${{ hashFiles('package.json') != '' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Run Release Please
        if: ${{ hashFiles('package.json') != '' }}
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish npm package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout released version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error("Release tag does not match package version");
            }
          '
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
